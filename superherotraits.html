<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-In and Superhero Traits</title>
    <link rel="stylesheet" href="style.css">

    <head>

    </head>

<body>

    <div class="section" id="trait-section">
        <h1>🦸‍♀️ Superhero Traits </h1>
        <div class="question"><b>Which Trait Describes You Today?</b></div>
        <div class="emoji-grid" id="trait-emojis">
    
            <div class="emoji-block" onclick="showQuote('strong')">
                <span class="emoji" data-id="strong">💪</span>
                <div class="label">strong</div>
            </div>
    
            <div class="emoji-block" onclick="showQuote('courage')">
                <span class="emoji" data-id="courage">🦸‍♂️</span>
                <div class="label">courage</div>
            </div>
    
            <div class="emoji-block" onclick="showQuote('Responsibility')">
                <span class="emoji" data-id="Responsibility">🛡️</span>
                <div class="label">Responsibility</div>
            </div>
    
            <div class="emoji-block" onclick="showQuote('wisdom')">
                <span class="emoji" data-id="wisdom">💡</span>
                <div class="label">wisdom</div>
            </div>
    
            <div class="emoji-block" onclick="showQuote('focused')">
                <span class="emoji" data-id="focused">🎯</span>
                <div class="label">focused</div>
            </div>
    
    
            <div class="emoji-block" onclick="showQuote('Leadership')">
                <span class="emoji" data-id="Leadership">👑</span>
                <div class="label">Leadership</div>
            </div>
    
    
            <div class="emoji-block" onclick="showQuote('smart')">
                <span class="emoji" data-id="smart">🧠</span>
                <div class="label">smart</div>
            </div>
    
    
            <div class="emoji-block" onclick="showQuote('confidence')">
                <span class="emoji" data-id="confidence">🌟</span>
                <div class="label">confidence</div>
            </div>
    
            <div class="emoji-block" onclick="showQuote('innovation')">
                <span class="emoji" data-id="Innovation">🤖</span>
                <div class="label">innovation</div>
            </div>
    
            <div class="emoji-block" onclick="showQuote('helpful')">
                <span class="emoji" data-id="helpful">🤝</span>
                <div class="label">Helpful</div>
            </div>
    
    
        </div>
        <div class="message-box" id="trait-message">Click a trait to see your superpower.</div>
    </div>
  

    <script src="script.js"></script>

</body>

</html>
