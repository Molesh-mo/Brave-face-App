
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-In and Superhero Traits</title>
    <link rel="stylesheet" href="style.css">    

</head>
<body>

<div class="section" id="feeling-section">
    <h1>🌟 Daily Check-In 🌟</h1>
    <div class="question"><b>How Are You Feeling?</b></div>
    <div class="emoji-grid" id="feeling-emojis">

        <div class="emoji-block" onclick="showQuote('happy')">
            <span class="emoji" data-id="happy">😀</span>
            <div class="label">Happy</div>
        </div>

        <div class="emoji-block" onclick="showQuote('sad')">
            <span class="emoji" data-id="sad">😢</span>
            <div class="label">sad</div>
        </div>

        <div class="emoji-block" onclick="showQuote('angry')">
            <span class="emoji" data-id="angry">😡</span>
            <div class="label">angry</div>
        </div>

        <div class="emoji-block" onclick="showQuote('scared')">
            <span class="emoji" data-id="scared">😨</span>
            <div class="label">scared</div>
        </div>

        <div class="emoji-block" onclick="showQuote('tired')">
            <span class="emoji" data-id="tired">😴</span>
            <div class="label">tired</div>
        </div>

        <div class="emoji-block" onclick="showQuote('excited')">
            <span class="emoji" data-id="excited">🤩</span>
            <div class="label">excited</div>
        </div>

        <div class="emoji-block" onclick="showQuote('confused')">
            <span class="emoji" data-id="confused">😕</span>
            <div class="label">confused</div>
        </div>

        <div class="emoji-block" onclick="showQuote('proud')">
            <span class="emoji" data-id="Proud">😌</span>
            <div class="label">Proud</div>
        </div>

        <div class="emoji-block" onclick="showQuote('grateful')">
            <span class="emoji" data-id="grateful">😇</span>
            <div class="label">grateful</div>
        </div>

        <div class="emoji-block" onclick="showQuote('Hopeful')">
            <span class="emoji" data-id="Hopeful">🌈</span>
            <div class="label">Hopeful</div>
        </div>

      
    </div>
    <div class="message-box" id="feeling-message">Click an emoji above to check in.</div>
</div>

    </div>
    </div>
    </div>
</div>
<script src="script.js"></script>

</body>

</html>
